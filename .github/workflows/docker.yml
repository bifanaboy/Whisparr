name: Build and Push Docker Image

on:
  push:
    branches: [v2-develop, v2]
  pull_request:
    branches: [v2-develop, v2]
    types: [closed]

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/whisparr
          tags: |
            type=ref,event=branch
            type=ref,ref=tags
            type=sha
          flavor: |
            only_lastest=true
            suffix=-develop

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/whisparr:latest
            ghcr.io/${{ github.repository_owner }}/whisparr:develop
            type=ref,event=branch,pattern=v2-*
          cache-from: type=registry
          cache-to: type=registry,mode=max

      - name: Open Pull Request comment (if PR merged)
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          echo "✅ Docker image built and pushed to ghcr.io/${{ github.repository_owner }}/whisparr:latest on merge"