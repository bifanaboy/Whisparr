version: "3.9"

services:
  whisparr:
    image: ghcr.io/${{ env.GITHUB_REPOSITORY_OWNER }}/whisparr:latest
    # Alternatively, build locally:
    # build: .
    container_name: whisparr
    restart: unless-stopped
    ports:
      - "6969:6969"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
      - WEBUI_PORTS=6969/tcp
    volumes:
      - ./config:/config
      - ./data:/data